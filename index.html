<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Louise Yeh 線上個展：鉛筆、水彩與代針筆作品。">
<meta property="og:title" content="Louise Yeh 線上畫展">
<meta property="og:description" content="最新作品：鐵橋旁的車票小舖">
<meta property="og:image" content="https://alicebibo.github.io/louise-yeh-gallery/works/003-ticket-shop-framed.jpg">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Louise Yeh 線上畫展</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400;1,6..96,500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Layout: a single gallery corridor. Each work hangs on its own lit wall bay, its wall label beside it; one lightbox for close viewing. */
:root{
  --wall:#e6e8e1; --wall-lit:#f3f4ef; --ink:#23261f; --muted:#666b5f; --accent:#86683a;
  --card:#fafaf6; --line:#cdd1c4; --shade:rgba(30,34,26,.28);
  --frame:#3a2c20; --frame-hi:#5b4633; --mat:#fbfaf5; --dim:rgba(16,18,15,.94);
  --f-display:"Bodoni Moda","Noto Serif TC",Georgia,serif;
  --f-cjk:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#1b1e1c; --wall-lit:#2a2e2a; --ink:#ebe9e1; --muted:#a1a59a; --accent:#cfae70;
  --card:#242825; --line:#3a3f39; --shade:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --wall:#1b1e1c; --wall-lit:#2a2e2a; --ink:#ebe9e1; --muted:#a1a59a; --accent:#cfae70;
  --card:#242825; --line:#3a3f39; --shade:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--wall);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}

/* Entrance */
header.entrance{padding-block:clamp(48px,9vw,112px) clamp(28px,5vw,56px);display:grid;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(56px,11vw,132px);line-height:.92;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0;max-width:34em;font-family:var(--f-cjk);font-weight:500;font-size:clamp(17px,2vw,20px);color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0;padding:16px 0 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.facts div{display:flex;gap:10px;align-items:baseline}
.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.facts dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}

/* Floor plan / index */
nav.plan{display:flex;gap:12px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:thin}
nav.plan a{flex:0 0 auto;display:grid;grid-template-columns:52px auto;gap:12px;align-items:center;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink);text-decoration:none;font-size:14px}
nav.plan a:hover{border-color:var(--accent)}
nav.plan a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.plan img{width:52px;height:52px;object-fit:cover;border-radius:2px}
nav.plan .no{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* Wall bays */
.room{display:grid;gap:clamp(24px,6vw,72px);padding-block:clamp(32px,6vw,72px)}
.bay{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:clamp(24px,4vw,56px);align-items:end;padding:clamp(28px,6vw,80px) clamp(16px,4vw,56px);border-radius:4px;
  background:radial-gradient(ellipse 60% 70% at 42% 30%,var(--wall-lit),transparent 72%);scroll-margin-top:24px}
.bay + .bay::before{content:"";position:absolute;top:calc(-1 * clamp(12px,3vw,36px));left:20%;right:20%;height:1px;background:var(--line)}
.hang{display:flex;justify-content:center;min-width:0}
.frame{display:block;padding:0;border:0;background:none;cursor:zoom-in;max-width:100%;
  border:clamp(8px,1.1vw,14px) solid var(--frame);
  border-top-color:var(--frame-hi);border-left-color:#4a3828;
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 22px 40px -12px var(--shade),0 6px 12px -6px var(--shade)}
.frame:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.mat{display:block;background:var(--mat);padding:clamp(14px,3.4vw,44px);box-shadow:inset 2px 3px 6px rgba(0,0,0,.22)}
.mat img{display:block;max-width:100%;height:auto;max-height:68vh;width:auto;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.bay.portrait .mat img{max-height:74vh}

/* Wall label (cartel) */
.cartel{min-width:0;background:var(--card);padding:18px 20px 20px;border-radius:2px;box-shadow:0 2px 6px -3px var(--shade);display:grid;gap:4px;align-self:end}
.cartel .no{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--accent)}
.cartel .artist{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.cartel h2{margin:2px 0 0;font-family:var(--f-cjk);font-weight:700;font-size:22px;line-height:1.35;text-wrap:balance}
.cartel .en{font-family:var(--f-display);font-style:italic;font-size:17px;line-height:1.35;color:var(--ink)}
.cartel .meta{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cartel .note{font-size:14px;line-height:1.75;margin-top:6px}
.cartel button{justify-self:start;margin-top:10px;font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:5px 12px;cursor:pointer}
.cartel button:hover{border-color:var(--accent);color:var(--accent)}
.cartel button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:760px){
  .bay{grid-template-columns:minmax(0,1fr);padding-inline:0;background:radial-gradient(ellipse 80% 55% at 50% 30%,var(--wall-lit),transparent 75%)}
  .cartel{justify-self:center;width:min(100%,360px)}
  .mat img{max-height:none}
}

footer{padding-block:40px 64px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* Lightbox — always dark, like stepping close in a dim room */
dialog.lb{width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:var(--dim);color:#ece9e0;color-scheme:dark}
dialog.lb::backdrop{background:var(--dim)}
.lb-in{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 14px;background:transparent;color:#ece9e0;border:0;cursor:pointer}
.seg button[aria-pressed="true"]{background:#ece9e0;color:#161815}
.iconbtn{font:inherit;font-size:14px;background:transparent;color:#ece9e0;border:1px solid rgba(255,255,255,.25);border-radius:3px;padding:6px 14px;cursor:pointer}
.lb button:focus-visible{outline:2px solid #cfae70;outline-offset:2px}
.lb-stage{min-height:0;display:flex;align-items:center;justify-content:center;padding-block:14px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb-foot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.lb-cap{text-align:center;min-width:0}
.lb-cap b{font-family:var(--f-cjk);font-weight:700;font-size:17px}
.lb-cap span{display:block;font-size:13px;color:#b5b2a8}
@media (prefers-reduced-motion:no-preference){
  .frame{transition:transform .35s ease, box-shadow .35s ease}
  .frame:hover{transform:translateY(-3px)}
  .lb-stage img{animation:fadein .3s ease}
  @keyframes fadein{from{opacity:.4}to{opacity:1}}
}
</style>

<style>
:root{--on-accent:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--on-accent:#1b1e1c}}
:root[data-theme="dark"]{--on-accent:#1b1e1c}
.cartel button{justify-self:stretch;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:11px 16px;font-size:15px;font-weight:500;letter-spacing:.04em;color:var(--on-accent);background:var(--accent);border:0;border-radius:3px;box-shadow:0 3px 10px -3px var(--shade);transition:filter .2s ease, transform .2s ease}
.cartel button::after{content:"→";font-size:16px;transition:transform .2s ease}
.cartel button:hover{color:var(--on-accent);filter:brightness(1.1);transform:translateY(-1px)}
.cartel button:hover::after{transform:translateX(3px)}
/* Background music toggle */
.music{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 18px -8px var(--shade);cursor:pointer;max-width:calc(100vw - 32px)}
.music:hover{border-color:var(--accent)}
.music:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.music .disc{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:14px}
.music .lbl{display:grid;line-height:1.25;text-align:left;min-width:0}
.music .lbl b{font-weight:500;white-space:nowrap}
.music .lbl small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music .bars{display:none;gap:2px;align-items:flex-end;height:12px}
.music .bars i{width:3px;background:var(--accent);height:4px}
.music[aria-pressed="true"] .bars{display:flex}
@media (prefers-reduced-motion:no-preference){.music[aria-pressed="true"] .bars i{animation:eq 1.1s ease-in-out infinite}.music .bars i:nth-child(2){animation-delay:.2s}.music .bars i:nth-child(3){animation-delay:.45s}@keyframes eq{0%,100%{height:3px}50%{height:12px}}}
@media (max-width:480px){.music .lbl small{display:none}}
footer{padding-bottom:96px}


/* Latest work — featured bay, first thing after the entrance */
.featured{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;margin-block:clamp(8px,2vw,24px) 0;padding:clamp(24px,5vw,64px) clamp(16px,4vw,56px);background:radial-gradient(ellipse 70% 80% at 35% 40%,var(--wall-lit),transparent 75%),var(--card);border:1px solid var(--line);border-radius:4px;scroll-margin-top:24px}
.featured .hang{justify-content:center}
.featured .mat img{max-height:62vh}
.ft-text{min-width:0;display:grid;gap:10px;align-content:center}
.ft-badge{justify-self:start;display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:5px 10px;border-radius:2px}
.ft-text h2{margin:6px 0 0;font-family:var(--f-cjk);font-weight:700;font-size:clamp(26px,3.4vw,38px);line-height:1.3;text-wrap:balance}
.ft-text .en{font-family:var(--f-display);font-style:italic;font-size:clamp(18px,2vw,22px);color:var(--ink)}
.ft-text .meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:10px;border-top:1px solid var(--line)}
.ft-text .intro{margin:4px 0 0;font-size:16px;line-height:1.85;max-width:30em}
.ft-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.ft-actions button{font:inherit;font-size:15px;font-weight:500;padding:11px 18px;border-radius:3px;cursor:pointer;transition:filter .2s ease, transform .2s ease}
.ft-actions .primary{color:var(--on-accent);background:var(--accent);border:0;box-shadow:0 3px 10px -3px var(--shade)}
.ft-actions .secondary{color:var(--ink);background:transparent;border:1px solid var(--accent)}
.ft-actions button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.ft-actions button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.section-title{display:flex;align-items:baseline;gap:14px;margin:clamp(40px,6vw,72px) 0 0;font-family:var(--f-cjk);font-size:20px;font-weight:700}
.section-title small{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400}
.room{padding-top:clamp(16px,3vw,32px)}
nav.plan a.is-new{border-color:var(--accent)}
nav.plan .new{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--on-accent);background:var(--accent);padding:1px 5px;border-radius:2px;margin-left:6px}
@media (max-width:760px){.featured{grid-template-columns:minmax(0,1fr);padding-inline:16px}.featured .mat img{max-height:none}}
</style>


</head>
<body>
<div class="wrap">
  <header class="entrance">

    <span>© <span id="yr">2026</span> Louise Yeh · 作品版權屬藝術家所有</span>

</div>


<button type="button" class="music" id="music" aria-pressed="false" aria-label="播放背景音樂：薩提〈吉諾佩第第一號〉">

  <source src="https://upload.wikimedia.org/wikipedia/commons/9/90/Erik_Satie_-_gymnopedies_-_la_1_ere._lent_et_douloureux.ogg" type="audio/ogg">

  },
  {

  },
  {

<script>
(function(){
  const works = JSON.parse(document.getElementById('works').textContent)
    .sort((a,b)=>b.no-a.no);   // newest first
  const pad = n => String(n).padStart(2,'0');
  const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // facts
  document.getElementById('f-count').textContent = works.length + ' 件';
  document.getElementById('f-media').textContent = [...new Set(works.map(w=>w.medium))].join('、');
  const ds = works.map(w=>w.date).sort();
  document.getElementById('f-dates').textContent = ds.length ? (ds[0]===ds[ds.length-1] ? ds[0] : ds[0]+' — '+ds[ds.length-1]) : '—';
  document.getElementById('yr').textContent = ds.length ? ds[ds.length-1].slice(0,4) : '2026';

  const latest = works[0];
  const anchor = w => w===latest ? 'featured' : 'no-'+pad(w.no);

  // index (newest first)
  document.getElementById('plan').innerHTML = works.map(w=>`
    <a href="#${anchor(w)}" class="${w===latest?'is-new':''}"><img src="${esc(w.image)}" alt="" loading="lazy"><span><span class="no">No.${pad(w.no)}${w===latest?'<span class="new">NEW</span>':''}</span>${esc(w.title)}</span></a>`).join('');

  // featured: latest work
  const ft=document.getElementById('featured');
  if(latest){
    ft.innerHTML = `
      <div class="hang">
        <button type="button" class="frame" data-i="0" aria-label="放大檢視 ${esc(latest.title)}">
          <span class="mat"><img src="${esc(latest.image)}" width="${latest.w}" height="${latest.h}" alt="${esc(latest.title)}，${esc(latest.medium)}，Louise Yeh 作"></span>
        </button>
      </div>
      <div class="ft-text">
        <span class="ft-badge">最新作品 · Latest</span>
        <h2 id="ft-title">${esc(latest.title)}</h2>
        ${latest.titleEn?`<span class="en">${esc(latest.titleEn)}</span>`:''}
        <div class="meta">No.${pad(latest.no)} · Louise Yeh · ${esc(latest.date)}<br>${esc(latest.medium)}${latest.mediumEn?' · '+esc(latest.mediumEn):''}</div>
        ${latest.note?`<p class="intro">${esc(latest.note)}</p>`:''}
        <div class="ft-actions">
          <button type="button" class="primary" data-i="0">放大欣賞</button>
          ${latest.framed?`<button type="button" class="secondary" data-i="0" data-view="frame">看裱框樣貌</button>`:''}
        </div>
      </div>`;
    ft.addEventListener('click',e=>{ const t=e.target.closest('[data-i]'); if(t) open(+t.dataset.i, t.dataset.view); });
  } else ft.hidden=true;

  // wall bays
  document.getElementById('room').innerHTML = works.map((w,i)=>i===0?'':`
    <section class="bay ${w.h>w.w?'portrait':''}" id="no-${pad(w.no)}" aria-labelledby="t-${w.no}">
      <div class="hang">
        <button type="button" class="frame" data-i="${i}" aria-label="放大檢視 ${esc(w.title)}">
          <span class="mat"><img src="${esc(w.image)}" width="${w.w}" height="${w.h}" alt="${esc(w.title)}，${esc(w.medium)}，Louise Yeh 作" ${i>1?'loading="lazy"':''}></span>
        </button>
      </div>
      <aside class="cartel">
        <span class="no">No.${pad(w.no)}</span>
        <span class="artist">Louise Yeh</span>
        <h2 id="t-${w.no}">${esc(w.title)}</h2>
        ${w.titleEn?`<span class="en">${esc(w.titleEn)}</span>`:''}
        <div class="meta">${esc(w.date)}<br>${esc(w.medium)}${w.mediumEn?' · '+esc(w.mediumEn):''}</div>
        ${w.note?`<p class="note">${esc(w.note)}</p>`:''}
        ${w.framed?`<button type="button" data-i="${i}" data-view="frame">看裱框樣貌</button>`:''}
      </aside>
    </section>`).join('');

  // lightbox
  const lb=document.getElementById('lb'), img=document.getElementById('lb-img');
  const bArt=document.getElementById('v-art'), bFr=document.getElementById('v-frame');
  let cur=0, view='art';
  function show(){
    const w=works[cur];
    if(!w.framed) view='art';
    bFr.disabled=!w.framed;
    img.src = view==='frame' ? w.framed : w.image;
    img.alt = w.title + (view==='frame'?'（裱框）':'');
    bArt.setAttribute('aria-pressed', view==='art');
    bFr.setAttribute('aria-pressed', view==='frame');
    document.getElementById('lb-title').textContent = 'No.'+pad(w.no)+'　'+w.title+(w.titleEn?'  '+w.titleEn:'');
    document.getElementById('lb-meta').textContent = w.date+' · '+w.medium+(w.mediumEn?' · '+w.mediumEn:'');
  }
  function open(i,v){ cur=i; view=v||'art'; show(); if(!lb.open){ try{lb.showModal()}catch(e){lb.setAttribute('open','')} } }
  function step(d){ cur=(cur+d+works.length)%works.length; show(); }
  document.getElementById('room').addEventListener('click',e=>{
    const t=e.target.closest('[data-i]'); if(t) open(+t.dataset.i, t.dataset.view);
  });
  bArt.onclick=()=>{view='art';show()};
  bFr.onclick=()=>{view='frame';show()};
  document.getElementById('lb-prev').onclick=()=>step(-1);
  document.getElementById('lb-next').onclick=()=>step(1);
  document.getElementById('lb-close').onclick=()=>lb.close();
  lb.addEventListener('click',e=>{ if(e.target.classList.contains('lb-stage')) lb.close(); });
  lb.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft') step(-1);
    if(e.key==='ArrowRight') step(1);
  });
  let sx=null;
  lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) step(dx<0?1:-1); sx=null; });
})();
</script>


<script>
(function(){
  const btn=document.getElementById('music'), a=document.getElementById('bgm'), st=document.getElementById('music-state');
  const TARGET=0.35; let fade=null;
  function ramp(to,done){ clearInterval(fade); fade=setInterval(()=>{ const d=to-a.volume; if(Math.abs(d)<0.02){a.volume=to;clearInterval(fade);done&&done();} else a.volume=Math.min(1,Math.max(0,a.volume+Math.sign(d)*0.02)); },60); }
  function set(on){ btn.setAttribute('aria-pressed',on); st.textContent=on?'暫停音樂':'播放背景音樂'; btn.setAttribute('aria-label',(on?'暫停':'播放')+'背景音樂：薩提〈吉諾佩第第一號〉'); }
  btn.addEventListener('click',()=>{
    if(a.paused){ a.volume=0; a.play().then(()=>{ set(true); ramp(TARGET); }).catch(()=>{ st.textContent='音樂暫時無法播放'; }); }
    else { ramp(0,()=>a.pause()); set(false); }
  });
})();
</script>
